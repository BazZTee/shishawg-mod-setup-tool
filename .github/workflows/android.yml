name: Android APK

on:
  release:
    types: [published]
  push:
    paths:
      - 'mobile/**'
      - 'src/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # ubuntu-latest has the Android SDK preinstalled (ANDROID_HOME).
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"

      # src/main needs the desktop dependencies (e.g. @supabase/supabase-js).
      # --ignore-scripts skips the Electron binary download.
      - name: Install desktop dependencies
        run: npm ci --ignore-scripts

      - name: Install
        working-directory: mobile
        run: npm ci

      - name: Test shims
        working-directory: mobile
        run: npm test

      - name: Build web and sync Android project
        working-directory: mobile
        run: |
          node scripts/build-web.cjs --minify
          npx cap sync android

      - name: Restore keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Kein ANDROID_KEYSTORE_BASE64-Secret gesetzt. Es wird nur eine Debug-APK gebaut."
          fi

      - name: Build APK
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          VERSION=$(node -p "require('../../package.json').version")
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/ShishaWG-Mod-Setup-Tool-$VERSION.apk"
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/ShishaWG-Mod-Setup-Tool-$VERSION-debug.apk"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: ${{ runner.temp }}/*.apk

      # On a release, or on a push to main whose version already has a release
      # (e.g. a release published before the Android build existed).
      - name: Attach APK to release
        if: steps.keystore.outputs.path != '' && (github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then TAG="v$(node -p "require('./package.json').version")"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP"/ShishaWG-Mod-Setup-Tool-*.apk --clobber
            echo "APK an Release $TAG angehängt."
          else
            echo "Kein Release $TAG vorhanden, nichts angehängt."
          fi
