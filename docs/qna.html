<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>ShishaWG Fragenrunde & Streamer Prompter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      color: #ffffff;
      user-select: none;
      background: #090a0f;
    }

    /* =========================================================
       MODE 1: OBS OVERLAY
       ========================================================= */
    body.mode-overlay {
      background: transparent !important;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 36px;
    }

    .obs-hud-card {
      width: 100%;
      max-width: 820px;
      margin: 0 24px;
      border-radius: 20px;
      border: 1px solid rgba(139, 92, 246, 0.35);
      background: linear-gradient(135deg, rgba(23, 15, 45, 0.96) 0%, rgba(13, 17, 38, 0.96) 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 22px 30px 18px 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 35px rgba(139, 92, 246, 0.2);
      position: relative;
      overflow: hidden;
      opacity: 0;
      transform: translateY(35px);
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    .obs-hud-card.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .obs-person-badge-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 10px;
    }

    .obs-person-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      background: rgba(139, 92, 246, 0.2);
      border: 1px solid rgba(139, 92, 246, 0.5);
      color: #c4b5fd;
    }

    .obs-person-badge .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #a78bfa;
      box-shadow: 0 0 8px #a78bfa;
      animation: pulse 1.5s infinite;
    }

    .obs-question-text {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.35;
      text-align: center;
      color: #ffffff;
      margin-bottom: 8px;
      word-break: break-word;
    }

    .obs-author-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 14px;
    }

    .obs-author-name {
      color: #38bdf8;
      font-weight: 700;
    }

    .obs-timer-track {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      overflow: hidden;
    }

    .obs-timer-fill {
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #8b5cf6);
      border-radius: 2px;
      width: 100%;
      transition: width 1s linear;
    }

    /* =========================================================
       MODE 2: STREAMER FRONTEND / PROMPTER (Base44 1:1 Design)
       ========================================================= */
    body.mode-screen {
      background: #090a0f !important;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    /* Top Navbar */
    .streamer-navbar {
      height: 60px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      background: #0d0f17;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
    }

    .streamer-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 17px;
      font-weight: 800;
      color: #ffffff;
    }

    .streamer-brand-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: #7c3aed;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      box-shadow: 0 0 12px rgba(124, 58, 237, 0.5);
    }

    .streamer-nav-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .wheel-toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      color: #e2e8f0;
      cursor: pointer;
    }

    .wheel-toggle-btn input {
      cursor: pointer;
      accent-color: #8b5cf6;
    }

    .btn-manual-sync {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      color: #94a3b8;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .btn-manual-sync:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.1);
    }

    /* Centered Stage Layout */
    .streamer-stage-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      max-width: 800px;
      width: 100%;
      margin: 30px auto;
      padding: 0 24px;
      text-align: center;
    }

    /* Oval Streamer Selector */
    .streamer-pills-box {
      background: #121520;
      border: 1px solid #1e2433;
      padding: 4px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 28px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .streamer-pill {
      padding: 6px 20px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      border: none;
      background: transparent;
      color: #64748b;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .streamer-pill:hover {
      color: #cbd5e1;
    }

    .streamer-pill.active {
      background: #1e3a8a;
      color: #93c5fd;
      box-shadow: 0 0 14px rgba(30, 58, 138, 0.5);
    }

    .streamer-pill.hasty.active {
      background: #14532d;
      color: #86efac;
      box-shadow: 0 0 14px rgba(20, 83, 45, 0.5);
    }

    .streamer-pill.kai.active {
      background: #7c2d12;
      color: #fdba74;
      box-shadow: 0 0 14px rgba(124, 45, 18, 0.5);
    }

    /* Big Purple Draw Button */
    .btn-big-draw {
      background: #7c3aed;
      color: #ffffff;
      font-size: 18px;
      font-weight: 800;
      padding: 16px 38px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 6px 25px rgba(124, 58, 237, 0.45);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-big-draw:hover:not(:disabled) {
      background: #6d28d9;
      transform: scale(1.04);
      box-shadow: 0 8px 30px rgba(124, 58, 237, 0.6);
    }

    .btn-big-draw:active:not(:disabled) {
      transform: scale(0.98);
    }

    .btn-big-draw:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      box-shadow: none;
    }

    .questions-count-label {
      font-size: 14px;
      color: #64748b;
      margin-top: 14px;
      font-weight: 600;
    }

    /* Empty State */
    .prompter-empty-card {
      margin-top: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .prompter-empty-title {
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
    }

    .prompter-empty-subtitle {
      font-size: 14px;
      color: #64748b;
    }

    /* Drawn Question Card */
    .prompter-drawn-card {
      background: #0f121d;
      border: 2px solid #7c3aed;
      border-radius: 20px;
      padding: 32px 36px;
      width: 100%;
      margin-top: 28px;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.6), 0 0 30px rgba(124, 58, 237, 0.25);
      position: relative;
    }

    .prompter-drawn-badge-btn {
      background: rgba(124, 58, 237, 0.15);
      border: 1px solid rgba(124, 58, 237, 0.4);
      color: #c4b5fd;
      padding: 5px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }

    .prompter-drawn-badge-btn:hover {
      background: rgba(124, 58, 237, 0.25);
      transform: scale(1.05);
    }

    .prompter-drawn-text {
      font-size: 28px;
      font-weight: 800;
      line-height: 1.4;
      color: #ffffff;
      margin: 18px 0 10px 0;
      word-break: break-word;
    }

    .prompter-drawn-author {
      font-size: 15px;
      color: #64748b;
      font-weight: 600;
      margin-bottom: 24px;
    }

    .prompter-drawn-author span {
      color: #38bdf8;
    }

    .prompter-action-row {
      display: flex;
      justify-content: center;
      gap: 14px;
    }

    .btn-action-done {
      background: #10b981;
      color: #ffffff;
      font-size: 15px;
      font-weight: 800;
      padding: 12px 26px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s;
    }

    .btn-action-done:hover {
      background: #059669;
      transform: scale(1.04);
    }

    .btn-action-skip {
      background: #ef4444;
      color: #ffffff;
      font-size: 15px;
      font-weight: 800;
      padding: 12px 26px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s;
    }

    .btn-action-skip:hover {
      background: #dc2626;
      transform: scale(1.04);
    }

    /* Status Bar Footer */
    .streamer-status-footer {
      padding: 12px 24px;
      font-size: 12px;
      color: #64748b;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      background: #0a0c13;
    }

    .status-badge-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 6px #10b981;
    }

    /* =========================================================
       SPINNING WHEEL MODAL (GLÜCKSRAD)
       ========================================================= */
    .wheel-modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(6, 8, 14, 0.95);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .wheel-modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .wheel-container {
      position: relative;
      width: 420px;
      height: 420px;
      margin-bottom: 24px;
    }

    #wheel-canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-shadow: 0 0 50px rgba(124, 58, 237, 0.4), 0 0 100px rgba(56, 189, 248, 0.2);
    }

    .wheel-pointer {
      position: absolute;
      top: -16px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 18px solid transparent;
      border-right: 18px solid transparent;
      border-top: 36px solid #ff0055;
      filter: drop-shadow(0 4px 10px rgba(255, 0, 85, 0.8));
      z-index: 10;
    }

    .wheel-center-hub {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: #0f172a;
      border: 4px solid #38bdf8;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      cursor: pointer;
      z-index: 5;
    }

    .wheel-winner-card {
      background: #0f121d;
      border: 2px solid #7c3aed;
      border-radius: 20px;
      padding: 24px 36px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(124, 58, 237, 0.4);
      max-width: 500px;
      width: 90%;
      margin-top: 16px;
      display: none;
    }

    .wheel-winner-card.show {
      display: block;
      animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .wheel-winner-title {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #c4b5fd;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .wheel-winner-text {
      font-size: 24px;
      font-weight: 900;
      color: #ffffff;
      margin-bottom: 18px;
    }

    .wheel-winner-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.6; }
    }

    @keyframes popIn {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body class="mode-screen">

  <!-- OBS OVERLAY (Visible only when ?mode=overlay) -->
  <div id="view-overlay-container" style="display:none; width:100%; height:100%; align-items:flex-end; justify-content:center;">
    <div class="obs-hud-card" id="obs-hud-card">
      <div class="obs-person-badge-wrapper" id="obs-badge-wrapper">
        <span class="obs-person-badge" id="obs-person-badge">
          <span class="pulse-dot"></span>
          <span id="obs-person-name">Marved ist dran</span>
        </span>
      </div>

      <div class="obs-question-text" id="obs-question-text">
        Lade Frage...
      </div>

      <div class="obs-author-row">
        <span>gestellt von</span>
        <span class="obs-author-name" id="obs-author-name">@Viewer</span>
      </div>

      <div class="obs-timer-track">
        <div class="obs-timer-fill" id="obs-timer-fill"></div>
      </div>
    </div>
  </div>

  <!-- STREAMER FRONTEND / PROMPTER (Base44 Exact) -->
  <div id="view-screen-container" style="display:flex; flex-direction:column; min-height:100vh;">
    <!-- Navbar -->
    <header class="streamer-navbar">
      <div class="streamer-brand">
        <div class="streamer-brand-icon">✨</div>
        <span>Fragenrunde</span>
      </div>

      <div class="streamer-nav-controls">
        <button id="btn-prompter-refresh" class="btn-manual-sync" title="Daten manuell neu laden">
          🔄 Sync
        </button>
        <label class="wheel-toggle-btn" title="Glücksrad für nicht beantwortete Fragen aktivieren/deaktivieren">
          <input type="checkbox" id="prompter-wheel-toggle" checked>
          <span>🎡 Bestrafungsrad</span>
        </label>
      </div>
    </header>

    <!-- Main Center Stage -->
    <main class="streamer-stage-container">
      <!-- Person Switcher Pills -->
      <div class="streamer-pills-box" id="prompter-persons-bar">
        <!-- Dynamic: [Marved] [Hasty] [Kai] -->
      </div>

      <!-- Big Purple Draw Button -->
      <div>
        <button id="btn-prompter-draw" class="btn-big-draw">
          <span>🔀</span> Random Frage ziehen
        </button>
      </div>

      <div class="questions-count-label" id="prompter-open-counter">
        Lade Fragen...
      </div>

      <!-- Empty State Card -->
      <div id="prompter-no-active-box" class="prompter-empty-card">
        <div class="prompter-empty-title">Keine Frage aktuell live.</div>
        <div class="prompter-empty-subtitle" id="prompter-total-count-sub">Klicke oben auf „Random Frage ziehen 🔀“ oder schalte im Mod-Tool eine Frage live!</div>
      </div>

      <!-- Active Drawn Question Card -->
      <div id="prompter-spotlight-box" class="prompter-drawn-card" style="display:none;">
        <button id="btn-prompter-cycle-person" class="prompter-drawn-badge-btn" title="Person wechseln">
          <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:currentColor;"></span>
          <span id="prompter-active-person-label">Marved ist dran</span>
          <span style="opacity:0.6; font-size:11px;">↻</span>
        </button>

        <div class="prompter-drawn-text" id="prompter-active-question-text">
          „Fragetext...“
        </div>

        <div class="prompter-drawn-author" id="prompter-active-author">
          von <span id="prompter-author-val">@Viewer</span>
        </div>

        <div class="prompter-action-row">
          <button id="btn-prompter-answered" class="btn-action-done">
            <span>✅</span> Beantwortet
          </button>
          <button id="btn-prompter-unanswered" class="btn-action-skip">
            <span id="unanswered-btn-icon">❌</span> <span id="unanswered-btn-label">Nicht beantwortet</span>
          </button>
        </div>
      </div>
    </main>

    <!-- Footer Status -->
    <footer class="streamer-status-footer">
      <span><span class="status-badge-dot"></span> <span id="status-conn-label">Supabase Live</span></span>
      <span>•</span>
      <span id="status-questions-label">0 Fragen</span>
      <span>•</span>
      <span id="status-sync-time">Sync: Läuft...</span>
    </footer>
  </div>

  <!-- SPINNING WHEEL MODAL -->
  <div id="wheel-modal" class="wheel-modal-backdrop">
    <div class="wheel-container">
      <div class="wheel-pointer"></div>
      <canvas id="wheel-canvas" width="500" height="500"></canvas>
      <div class="wheel-center-hub" id="wheel-center-hub" title="Klicken zum Drehen">
        🎡
      </div>
    </div>

    <button id="btn-spin-wheel" class="btn-big-draw" style="font-size:16px; padding:12px 30px;">
      🎲 JETZT DREHEN!
    </button>

    <div class="wheel-winner-card" id="wheel-winner-card">
      <div class="wheel-winner-title">🔥 Bestrafung gezogen:</div>
      <div class="wheel-winner-text" id="wheel-winner-text">10 Liegestütze</div>
      <div class="wheel-winner-actions">
        <button id="btn-wheel-done" class="btn-action-done" style="font-size:14px; padding:10px 20px;">
          ✅ Erledigt &amp; Weiter
        </button>
        <button id="btn-wheel-spin-again" class="btn-action-skip" style="font-size:14px; padding:10px 20px;">
          🔄 Nochmal drehen
        </button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_REST = 'https://gdaprclycouoxtffcuxb.supabase.co/rest/v1';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdkYXByY2x5Y291b3h0ZmZjdXhiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxNzYxNjMsImV4cCI6MjEwMzc1MjE2M30.4F1ub67JbrXlIFH4tceMQuE7lZ9Yx7sfNogZ6cIfIFE';

    const reqHeaders = {
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
      'Content-Type': 'application/json',
      'Prefer': 'return=representation'
    };

    const urlParams = new URLSearchParams(window.location.search);
    const modeParam = urlParams.get('mode');
    const isOverlay = (modeParam === 'overlay');
    const targetChannel = (urlParams.get('channel') || 'marved').toLowerCase().replace('#', '').trim();
    const isPersistent = urlParams.get('persistent') === '1';

    let currentQuestions = [];
    let activeQuestion = null;
    let bestrafungen = [];
    let qnaSettings = {
      persons: ['Marved', 'Hasty', 'Kai'],
      activePerson: 'Marved',
      wheelEnabled: true,
      displayDuration: 10
    };

    let obsTimerInterval = null;
    let obsTimeLeft = 10;
    let lastActiveId = null;
    let isSpinning = false;
    let wheelAngle = 0;
    let selectedBestrafung = null;

    if (isOverlay) {
      document.body.className = 'mode-overlay';
      document.getElementById('view-overlay-container').style.display = 'flex';
      document.getElementById('view-screen-container').style.display = 'none';
    } else {
      document.body.className = 'mode-screen';
      document.getElementById('view-overlay-container').style.display = 'none';
      document.getElementById('view-screen-container').style.display = 'flex';
    }

    async function syncAllData() {
      try {
        // 1. Fetch Questions
        const qRes = await fetch(`${SUPABASE_REST}/qna_questions?select=*&order=created_at.desc&t=${Date.now()}`, {
          headers: reqHeaders
        });
        if (qRes.ok) {
          const qData = await qRes.json();
          if (Array.isArray(qData)) {
            // Include questions for targetChannel or all if only 1 channel exists
            let filtered = qData.filter(r => !r.channel || r.channel.toLowerCase().replace('#', '') === targetChannel);
            if (filtered.length === 0 && qData.length > 0) {
              filtered = qData;
            }
            currentQuestions = filtered.map(r => ({
              id: r.id,
              channel: r.channel,
              login: r.login,
              displayName: r.display_name,
              userColor: r.user_color,
              question: r.question,
              status: r.status,
              person: r.person || '',
              timestamp: new Date(r.created_at).getTime()
            }));
            activeQuestion = currentQuestions.find(q => q.status === 'on_air') || null;
          }
        }
      } catch(e) {
        console.warn('Questions fetch error:', e);
      }

      try {
        // 2. Fetch Settings
        const sRes = await fetch(`${SUPABASE_REST}/qna_settings?select=*&order=updated_at.desc&t=${Date.now()}`, {
          headers: reqHeaders
        });
        if (sRes.ok) {
          const sData = await sRes.json();
          if (Array.isArray(sData) && sData.length > 0) {
            const s = sData.find(x => x.channel && x.channel.toLowerCase().replace('#', '') === targetChannel) || sData[0];
            if (Array.isArray(s.persons) && s.persons.length > 0) {
              qnaSettings.persons = s.persons;
            }
            if (s.active_person) {
              qnaSettings.activePerson = s.active_person;
            }
            qnaSettings.wheelEnabled = s.wheel_enabled !== false;
            qnaSettings.displayDuration = s.display_duration || 10;
          }
        }
      } catch(e) {
        console.warn('Settings fetch error:', e);
      }

      try {
        // 3. Fetch Bestrafungen
        const bRes = await fetch(`${SUPABASE_REST}/bestrafungen?select=*&order=created_at.desc&t=${Date.now()}`, {
          headers: reqHeaders
        });
        if (bRes.ok) {
          const bData = await bRes.json();
          if (Array.isArray(bData)) {
            bestrafungen = bData;
          }
        }
      } catch(e) {
        console.warn('Bestrafungen fetch error:', e);
      }

      const syncTimeEl = document.getElementById('status-sync-time');
      if (syncTimeEl) {
        syncTimeEl.textContent = 'Sync: ' + new Date().toLocaleTimeString('de-DE');
      }
      const questionsLabelEl = document.getElementById('status-questions-label');
      if (questionsLabelEl) {
        const onAirCount = activeQuestion ? 1 : 0;
        questionsLabelEl.textContent = `${currentQuestions.length} Fragen (${onAirCount} Live)`;
      }

      renderCurrentView();
    }

    function renderCurrentView() {
      if (isOverlay) {
        renderOBSOverlay();
      } else {
        renderScreenPrompter();
      }
    }

    function renderScreenPrompter() {
      const personsBar = document.getElementById('prompter-persons-bar');
      if (personsBar) {
        personsBar.innerHTML = qnaSettings.persons.map(p => {
          const isActive = (p === qnaSettings.activePerson);
          const pLower = p.toLowerCase();
          const cls = (pLower === 'marved' || pLower === 'hasty' || pLower === 'kai') ? pLower : '';
          return `
            <button class="streamer-pill ${cls} ${isActive ? 'active' : ''}" data-person="${escapeHtml(p)}">
              ${escapeHtml(p)}
            </button>
          `;
        }).join('');

        personsBar.querySelectorAll('.streamer-pill').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            const p = e.currentTarget.getAttribute('data-person');
            qnaSettings.activePerson = p;
            await saveSettingsRemote();
            renderScreenPrompter();
          });
        });
      }

      const wheelToggle = document.getElementById('prompter-wheel-toggle');
      if (wheelToggle) {
        wheelToggle.checked = qnaSettings.wheelEnabled;
      }
      const unBtnIcon = document.getElementById('unanswered-btn-icon');
      const unBtnLabel = document.getElementById('unanswered-btn-label');
      if (unBtnIcon && unBtnLabel) {
        unBtnIcon.textContent = qnaSettings.wheelEnabled ? '🎡' : '⏭️';
        unBtnLabel.textContent = qnaSettings.wheelEnabled ? 'Nicht beantwortet (Rad)' : 'Überspringen';
      }

      const openCount = currentQuestions.filter(q => q.status === 'approved' || q.status === 'pending').length;
      const counterEl = document.getElementById('prompter-open-counter');
      if (counterEl) counterEl.textContent = `${openCount} offene Fragen übrig`;

      const btnDraw = document.getElementById('btn-prompter-draw');
      if (btnDraw) btnDraw.disabled = (openCount === 0);

      const totalCount = currentQuestions.length;
      const subCounter = document.getElementById('prompter-total-count-sub');

      const spotBox = document.getElementById('prompter-spotlight-box');
      const noActiveBox = document.getElementById('prompter-no-active-box');

      if (activeQuestion) {
        if (spotBox) spotBox.style.display = 'block';
        if (noActiveBox) noActiveBox.style.display = 'none';

        const personLabel = document.getElementById('prompter-active-person-label');
        if (personLabel) personLabel.textContent = `${activeQuestion.person || qnaSettings.activePerson} ist dran`;

        const qText = document.getElementById('prompter-active-question-text');
        if (qText) qText.textContent = `„${activeQuestion.question}“`;

        const authorVal = document.getElementById('prompter-author-val');
        if (authorVal) authorVal.textContent = `@${activeQuestion.displayName || activeQuestion.login}`;
      } else {
        if (spotBox) spotBox.style.display = 'none';
        if (noActiveBox) noActiveBox.style.display = 'flex';
        if (subCounter) {
          subCounter.textContent = (openCount > 0)
            ? `${openCount} offene Fragen in der Warteschlange. Klicke auf „Random Frage ziehen 🔀“!`
            : `Alle ${totalCount} Fragen wurden beantwortet!`;
        }
      }
    }

    async function saveSettingsRemote() {
      try {
        await fetch(`${SUPABASE_REST}/qna_settings?on_conflict=channel`, {
          method: 'POST',
          headers: Object.assign({}, reqHeaders, { 'Prefer': 'resolution=merge-duplicates' }),
          body: JSON.stringify({
            channel: targetChannel,
            persons: qnaSettings.persons,
            active_person: qnaSettings.activePerson,
            wheel_enabled: qnaSettings.wheelEnabled,
            display_duration: qnaSettings.displayDuration,
            updated_at: new Date().toISOString()
          })
        });
      } catch(e) {}
    }

    const btnRefresh = document.getElementById('btn-prompter-refresh');
    if (btnRefresh) {
      btnRefresh.addEventListener('click', async () => {
        btnRefresh.textContent = '⏳ Lädt...';
        await syncAllData();
        btnRefresh.textContent = '🔄 Sync';
      });
    }

    const btnDraw = document.getElementById('btn-prompter-draw');
    if (btnDraw) {
      btnDraw.addEventListener('click', async () => {
        const pool = currentQuestions.filter(q => q.status === 'approved' || q.status === 'pending');
        if (pool.length === 0) return;
        const randomQ = pool[Math.floor(Math.random() * pool.length)];

        // Reset previous on_air
        await fetch(`${SUPABASE_REST}/qna_questions?channel=eq.${encodeURIComponent(targetChannel)}&status=eq.on_air`, {
          method: 'PATCH',
          headers: reqHeaders,
          body: JSON.stringify({ status: 'approved', updated_at: new Date().toISOString() })
        });

        // Set chosen to on_air
        await fetch(`${SUPABASE_REST}/qna_questions?id=eq.${encodeURIComponent(randomQ.id)}`, {
          method: 'PATCH',
          headers: reqHeaders,
          body: JSON.stringify({
            status: 'on_air',
            person: qnaSettings.activePerson,
            updated_at: new Date().toISOString()
          })
        });

        await syncAllData();
      });
    }

    const btnCycle = document.getElementById('btn-prompter-cycle-person');
    if (btnCycle) {
      btnCycle.addEventListener('click', async () => {
        const idx = qnaSettings.persons.indexOf(qnaSettings.activePerson);
        const next = qnaSettings.persons[(idx + 1) % qnaSettings.persons.length];
        qnaSettings.activePerson = next;

        if (activeQuestion) {
          await fetch(`${SUPABASE_REST}/qna_questions?id=eq.${encodeURIComponent(activeQuestion.id)}`, {
            method: 'PATCH',
            headers: reqHeaders,
            body: JSON.stringify({ person: next, updated_at: new Date().toISOString() })
          });
        }
        await saveSettingsRemote();
        await syncAllData();
      });
    }

    const btnAnswered = document.getElementById('btn-prompter-answered');
    if (btnAnswered) {
      btnAnswered.addEventListener('click', async () => {
        if (!activeQuestion) return;
        await fetch(`${SUPABASE_REST}/qna_questions?id=eq.${encodeURIComponent(activeQuestion.id)}`, {
          method: 'PATCH',
          headers: reqHeaders,
          body: JSON.stringify({ status: 'answered', updated_at: new Date().toISOString() })
        });
        await cycleToNextPerson();
      });
    }

    const btnUnanswered = document.getElementById('btn-prompter-unanswered');
    if (btnUnanswered) {
      btnUnanswered.addEventListener('click', async () => {
        if (!activeQuestion) return;
        if (qnaSettings.wheelEnabled) {
          openSpinningWheel();
        } else {
          await fetch(`${SUPABASE_REST}/qna_questions?id=eq.${encodeURIComponent(activeQuestion.id)}`, {
            method: 'PATCH',
            headers: reqHeaders,
            body: JSON.stringify({ status: 'answered', updated_at: new Date().toISOString() })
          });
          await cycleToNextPerson();
        }
      });
    }

    const prompterWheelToggle = document.getElementById('prompter-wheel-toggle');
    if (prompterWheelToggle) {
      prompterWheelToggle.addEventListener('change', async (e) => {
        qnaSettings.wheelEnabled = !!e.target.checked;
        await saveSettingsRemote();
        renderScreenPrompter();
      });
    }

    async function cycleToNextPerson() {
      const idx = qnaSettings.persons.indexOf(qnaSettings.activePerson);
      const next = qnaSettings.persons[(idx + 1) % qnaSettings.persons.length];
      qnaSettings.activePerson = next;
      await saveSettingsRemote();
      await syncAllData();
    }

    function renderOBSOverlay() {
      const card = document.getElementById('obs-hud-card');
      if (!card) return;

      if (!activeQuestion) {
        card.classList.remove('visible');
        lastActiveId = null;
        if (obsTimerInterval) clearInterval(obsTimerInterval);
        return;
      }

      if (activeQuestion.id !== lastActiveId) {
        lastActiveId = activeQuestion.id;

        const personEl = document.getElementById('obs-person-name');
        const pName = activeQuestion.person || qnaSettings.activePerson || 'Marved';
        if (personEl) personEl.textContent = `${pName} ist dran`;

        const qTextEl = document.getElementById('obs-question-text');
        if (qTextEl) qTextEl.textContent = `„${activeQuestion.question}“`;

        const authorEl = document.getElementById('obs-author-name');
        if (authorEl) authorEl.textContent = `@${activeQuestion.displayName || activeQuestion.login}`;

        card.classList.add('visible');

        const fillEl = document.getElementById('obs-timer-fill');
        if (fillEl) fillEl.style.width = '100%';

        if (!isPersistent) {
          if (obsTimerInterval) clearInterval(obsTimerInterval);
          const duration = qnaSettings.displayDuration || 10;
          obsTimeLeft = duration;

          obsTimerInterval = setInterval(() => {
            obsTimeLeft -= 1;
            if (fillEl) {
              const pct = Math.max(0, (obsTimeLeft / duration) * 100);
              fillEl.style.width = `${pct}%`;
            }
            if (obsTimeLeft <= 0) {
              clearInterval(obsTimerInterval);
              card.classList.remove('visible');
            }
          }, 1000);
        }
      }
    }

    const wheelColors = ['#f43f5e', '#8b5cf6', '#3b82f6', '#10b981', '#f59e0b', '#ec4899', '#06b6d4', '#84cc16'];

    function openSpinningWheel() {
      const openBestrafungen = bestrafungen.filter(b => b.status === 'offen');
      if (openBestrafungen.length === 0) {
        alert('Keine offenen Bestrafungen vorhanden! Lege zuerst im Mod-Tool Bestrafungen an.');
        return;
      }

      const modal = document.getElementById('wheel-modal');
      const winnerCard = document.getElementById('wheel-winner-card');
      if (winnerCard) winnerCard.classList.remove('show');
      if (modal) modal.classList.add('active');

      drawWheelCanvas(openBestrafungen);
    }

    function drawWheelCanvas(items) {
      const canvas = document.getElementById('wheel-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const numSegments = items.length;
      const arcSize = (2 * Math.PI) / numSegments;
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const radius = canvas.width / 2 - 10;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < numSegments; i++) {
        const angle = wheelAngle + i * arcSize;
        ctx.beginPath();
        ctx.fillStyle = wheelColors[i % wheelColors.length];
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius, angle, angle + arcSize);
        ctx.lineTo(centerX, centerY);
        ctx.fill();
        ctx.stroke();

        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(angle + arcSize / 2);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 16px Inter, sans-serif';
        ctx.shadowColor = 'rgba(0,0,0,0.8)';
        ctx.shadowBlur = 6;
        
        let label = items[i].name;
        if (label.length > 20) label = label.substr(0, 18) + '...';
        ctx.fillText(label, radius - 24, 6);
        ctx.restore();
      }
    }

    function spinWheel() {
      if (isSpinning) return;
      const openBestrafungen = bestrafungen.filter(b => b.status === 'offen');
      if (openBestrafungen.length === 0) return;

      isSpinning = true;
      const btnSpin = document.getElementById('btn-spin-wheel');
      if (btnSpin) btnSpin.disabled = true;

      const numSegments = openBestrafungen.length;
      const arcSize = (2 * Math.PI) / numSegments;

      const winningIndex = Math.floor(Math.random() * numSegments);
      selectedBestrafung = openBestrafungen[winningIndex];

      const targetSegmentAngle = winningIndex * arcSize + arcSize / 2;
      const totalSpins = 5 + Math.random() * 3;
      const totalRotation = totalSpins * 2 * Math.PI + (1.5 * Math.PI - targetSegmentAngle);

      const startTime = performance.now();
      const duration = 4000;
      const startAngle = wheelAngle;

      function animateSpin(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const easeOut = 1 - Math.pow(1 - progress, 3);

        wheelAngle = startAngle + totalRotation * easeOut;
        drawWheelCanvas(openBestrafungen);

        if (progress < 1) {
          requestAnimationFrame(animateSpin);
        } else {
          isSpinning = false;
          if (btnSpin) btnSpin.disabled = false;
          showWheelWinner(selectedBestrafung);
        }
      }

      requestAnimationFrame(animateSpin);
    }

    function showWheelWinner(item) {
      const winnerCard = document.getElementById('wheel-winner-card');
      const winnerText = document.getElementById('wheel-winner-text');
      if (winnerText) winnerText.textContent = item.name;
      if (winnerCard) winnerCard.classList.add('show');
    }

    const btnSpin = document.getElementById('btn-spin-wheel');
    const hubSpin = document.getElementById('wheel-center-hub');
    if (btnSpin) btnSpin.addEventListener('click', spinWheel);
    if (hubSpin) hubSpin.addEventListener('click', spinWheel);

    const btnWheelDone = document.getElementById('btn-wheel-done');
    if (btnWheelDone) {
      btnWheelDone.addEventListener('click', async () => {
        if (selectedBestrafung) {
          await fetch(`${SUPABASE_REST}/bestrafungen?id=eq.${encodeURIComponent(selectedBestrafung.id)}`, {
            method: 'PATCH',
            headers: reqHeaders,
            body: JSON.stringify({ status: 'erledigt' })
          });
        }
        if (activeQuestion) {
          await fetch(`${SUPABASE_REST}/qna_questions?id=eq.${encodeURIComponent(activeQuestion.id)}`, {
            method: 'PATCH',
            headers: reqHeaders,
            body: JSON.stringify({ status: 'answered', updated_at: new Date().toISOString() })
          });
        }
        document.getElementById('wheel-modal').classList.remove('active');
        await cycleToNextPerson();
      });
    }

    const btnWheelSpinAgain = document.getElementById('btn-wheel-spin-again');
    if (btnWheelSpinAgain) {
      btnWheelSpinAgain.addEventListener('click', async () => {
        if (selectedBestrafung) {
          await fetch(`${SUPABASE_REST}/bestrafungen?id=eq.${encodeURIComponent(selectedBestrafung.id)}`, {
            method: 'PATCH',
            headers: reqHeaders,
            body: JSON.stringify({ status: 'erledigt' })
          });
        }
        document.getElementById('wheel-winner-card').classList.remove('show');
        await syncAllData();
        openSpinningWheel();
      });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    syncAllData();
    setInterval(syncAllData, 1500);
  </script>
</body>
</html>
